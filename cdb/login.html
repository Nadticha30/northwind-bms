<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northwind BMS - เข้าสู่ระบบ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { border: none; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
    </style>
</head>
<body>

    <div class="card login-card p-4 bg-white">
        <div class="text-center mb-4">
            <div class="bg-primary-subtle text-primary p-3 rounded-circle d-inline-block mb-3">
                <i class="fa-solid fa-boxes-stacked fs-2"></i>
            </div>
            <h4 class="fw-bold text-dark">NORTHWIND <span class="text-primary">BMS</span></h4>
            <p class="text-muted small">กรุณาเข้าสู่ระบบเพื่อใช้งาน</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label class="form-label fw-semibold">ชื่อผู้ใช้งาน (Username)</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="username" class="form-control" placeholder="admin" required value="admin">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">รหัสผ่าน (Password)</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="123456" required value="123456">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold">
                <i class="fa-solid fa-right-to-bracket me-2"></i>เข้าสู่ระบบ (Login)
            </button>
        </form>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(u === 'admin' && p === '123456') {
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'dashboard.html';
            } else {
                alert('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง (ลอง admin / 123456)');
            }
        }
    </script>
</body>
</html>
